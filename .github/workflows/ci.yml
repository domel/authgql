name: Prototype checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install development checks
        run: python -m pip install --upgrade ruff mypy

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run Ruff
        run: ruff check .

      - name: Run mypy
        run: mypy authgql authgql_console.py evaluate.py
